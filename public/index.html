<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание CS-2411</title>
<meta name="description" content="Расписание группы CS-2411: пары, кабинеты, преподаватели.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f6f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CS-2411">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="ttl">
      <h1 id="gname">Расписание</h1>
      <p id="gmeta"></p>
    </div>
    <div class="acts">
      <button class="btn" id="todayBtn" title="К сегодняшнему дню"><span class="tt">Сегодня</span></button>
      <button class="btn ico" id="themeBtn" aria-label="Сменить тему"></button>
    </div>
  </header>

  <div class="status" id="status" hidden></div>
  <div class="legend" id="legend"></div>

  <!-- ===== компьютер: лента дней с прокруткой по неделям ===== -->
  <section class="week" aria-label="Календарь">
    <div class="week-bar">
      <div class="wb-left">
        <span class="wb-range" id="weekLabel"></span>
        <span class="wb-hint" id="weekHint"></span>
      </div>
      <div class="wb-nav">
        <button class="btn ico sm" id="prevWeek" aria-label="Предыдущая неделя">
          <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
        <button class="btn ico sm" id="nextWeek" aria-label="Следующая неделя">
          <svg viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
      </div>
    </div>
    <div class="scroller" id="scroller"><div class="grid" id="grid"></div></div>
  </section>

  <!-- ===== телефон: дни листаются вбок ===== -->
  <section class="mob">
    <div class="mob-bar"><span id="mWeek"></span></div>
    <nav class="tabs" id="dayTabs" role="tablist" aria-label="Дни недели"></nav>
    <div class="pager" id="pager"></div>
  </section>

  <footer id="foot"></footer>
</div>

<div class="veil" id="veil"></div>
<div class="card" id="card" role="dialog" aria-modal="true"></div>

<script src="schedule.js"></script>
<script src="app.js"></script>
</body>
</html>
